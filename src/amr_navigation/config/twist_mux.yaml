twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: "/cmd_vel_teleop"
        timeout: 0.5
        priority: 100
      navigation:
        # Now routes through velocity_smoother's output, not controller_server's
        # raw /cmd_vel_raw directly - see navigation.launch.py's velocity_smoother_node.
        topic: "/cmd_vel_smoothed"
        timeout: 0.5
        priority: 10
