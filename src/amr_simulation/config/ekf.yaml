ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    # predict_to_current_time was tried here and reproducibly crashed
    # ekf_node (SIGSEGV) once live odom0/imu0 data was flowing - it did NOT
    # crash standalone with no sensor input (verified under gdb), so it's
    # specifically the live-data prediction path that's broken in this
    # installed version (3.5.4-1jammy). Left disabled (the parameter's own
    # default) until a version without this bug is available.
    # predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: disabled from translation/rotation fusion to avoid wheel slippage noise
    odom0: /diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   false, false, false,   # Do not fuse wheel vx, vy (highly noisy)
                   false, false, false,   # Do not fuse wheel vyaw
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # RF2O Laser Odometry: Master of Translation (cleaned and wrapped via sensor_wrapper_node)
    odom1: /rf2o/odom_clean
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # FUSE vx, vy (RF2O Master of Translation!)
                   false, false, false,   # IGNORE laser yaw rate completely to avoid coupling errors
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    # Webots IMU triplet, cleaned and frame-stamped via sensor_wrapper_node
    # FUSE ANGULAR VELOCITY ONLY from the IMU (Master of Rotation!)
    imu0: /imu/data_clean
    imu0_config: [false, false, false,
                  false, false, false,   # Disable absolute roll/pitch/yaw
                  false, false, false,
                  false, false, true,    # FUSE vyaw (gyro yaw rate Z)
                  false, false, false]   # (Linear acceleration is false due to NaN bug)
    imu0_queue_size: 10
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
